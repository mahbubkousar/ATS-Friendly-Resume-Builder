name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, curl, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit and architecture tests
        run: php tests/run.php
      - name: HTTP contract smoke tests
        run: bash tests/http-smoke.sh
