<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeSync | Dashboard</title>
    <link rel="stylesheet" href="./output.css"> 
</head>
<body class="bg-blue-200  antialiased min-h-screen">

    <header class="bg-blue-50 shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
    <div class="flex items-center space-x-4">
        <button id="sidebar-toggle" class="text-gray-600 hover:text-primary-cute md:hidden">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        </button>
        <h1 class="text-2xl font-bold text-primary-cute">Dashboard</h1>
    </div>

    <div class="flex items-center space-x-4">
        <a href="editor.html" class="bg-blue-200 text-black px-4 py-2 rounded-lg font-semibold shadow-lg hover:bg-orange-600 transition duration-300 transform hover:scale-[1.03] text-sm md:text-base">
            + New Resume
        </a>
        
        <div class="relative group">
            <button class="flex items-center space-x-2 p-1 rounded-full hover:bg-gray-200 transition duration-150">
                <img class="h-8 w-8 rounded-full object-cover" src="/src/boy.png" alt="User Avatar" onerror="this.onerror=null;this.src='https://via.placeholder.com/32?text=U'">
                <span class="hidden sm:inline text-sm font-medium text-gray-700">User Name</span>
            </button>
            
            <div class="absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-xl hidden group-hover:block z-20">
                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                <a href="login.html" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-b-lg">Logout</a>
            </div>
        </div>
    </div>
</header>
<div class="flex">

    <aside id="sidebar" class="w-64 bg-blue-100 shadow-xl min-h-screen border-r border-gray-200 p-4 fixed md:relative hidden md:block z-10">
        <nav class="space-y-2">
            
            <a href="dashboard.html" class="flex items-center space-x-3 p-3 rounded-lg text-black bg-blue-200 font-semibold shadow-md transition duration-150">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Dashboard</span>
            </a>

            <a href="#" class="flex items-center space-x-3 p-3 rounded-lg text-gray-700 hover:bg-blue-200 transition duration-150">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Saved Resumes</span>
            </a>
            
            <a href="#" class="flex items-center space-x-3 p-3 rounded-lg text-gray-700 hover:bg-blue-200 transition duration-150">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>Templates</span>
            </a>

            <a href="#" class="flex items-center space-x-3 p-3 rounded-lg text-gray-700 hover:bg-blue-200 transition duration-150">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Settings</span>
            </a>
            
            <div class="border-t border-gray-200 pt-2"></div>
            
            <a href="login.html" class="flex items-center space-x-3 p-3 rounded-lg text-red-600 hover:bg-red-50 transition duration-150">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span>Logout</span>
            </a>

        </nav>
    </aside>
    
    <main class="grow p-4 md:p-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">My Resumes</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            
            <a href="editor.html" class="flex flex-col items-center justify-center p-6 bg-white border-2 border-dashed border-primary-cute/50 rounded-lg shadow-sm hover:shadow-xl transition duration-300 h-56">
                <svg class="w-12 h-12 text-primary-cute mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-lg font-semibold text-primary-cute">Create New Resume</span>
            </a>

            <div class="bg-white p-4 rounded-lg shadow-lg hover:shadow-xl transition duration-300 h-56 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-800 truncate">Professional Resume - (Marketing)</h3>
                    <p class="text-sm text-gray-500 mt-1">Last Updated: Nov 3, 2025</p>
                </div>
                <div class="flex space-x-2 mt-4">
                    <a href="editor.html" class="text-sm font-semibold text-white-200 bg-gray-200 px-3 py-1 rounded-md hover:bg-orange-600">Edit</a>
                    <button class="text-sm font-semibold text-gray-700 bg-gray-200 px-3 py-1 rounded-md hover:bg-gray-300">Download</button>
                    <button class="text-sm font-semibold text-red-600 bg-red-50 px-3 py-1 rounded-md hover:bg-red-100">Delete</button>
                </div>
            </div>
            
            <div class="bg-white p-4 rounded-lg shadow-lg hover:shadow-xl transition duration-300 h-56 flex flex-col justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-800 truncate">Academic CV - (Research)</h3>
                    <p class="text-sm text-gray-500 mt-1">Last Updated: Oct 20, 2025</p>
                </div>
                <div class="flex space-x-2 mt-4">
                    <a href="editor.html" class="text-sm font-semibold text-white-200 bg-gray-200 px-3 py-1 rounded-md hover:bg-orange-600">Edit</a>
                    <button class="text-sm font-semibold text-gray-700 bg-gray-200 px-3 py-1 rounded-md hover:bg-gray-300">Download</button>
                    <button class="text-sm font-semibold text-red-600 bg-red-50 px-3 py-1 rounded-md hover:bg-red-100">Delete</button>
                </div>
            </div>
            
            </div>
    </main>
</div>
    
    <script src="./main.js"></script>
</body>
</html>
