<!DOCTYPE html>
<html lang="en">
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>ResumeSync | Login</title>
</head>
<body class="bg-blue-200 antialiased min-h-screen flex items-center justify-center">

<div class="w-full max-w-md p-8 m-4 bg-white rounded-xl shadow-2xl transition duration-300">
    
    <div class="text-center mb-8">
        <a href="index.html" class="text-3xl font-extrabold text-primary-cute tracking-tight">
            ResumeSync
        </a>
        <h2 class="mt-4 text-2xl font-semibold text-gray-700">
            Sign in to your account
        </h2>
    </div>

    <form class="space-y-6">
        
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required
                class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary-cute focus:border-primary-cute sm:text-sm transition duration-150"
                placeholder="you@example.com"
            >
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                class="appearance-none block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-primary-cute focus:border-primary-cute sm:text-sm transition duration-150"
                placeholder="••••••••"
            >
        </div>

        <div class="flex justify-end">
            <a href="#" class="text-sm font-medium text-primary-cute hover:text-primary-cute/80 transition duration-150">
                Forgot your password?
            </a>
        </div>

        <div>
            <button type="submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-bold text-black bg-yellow-100 hover:bg-yellow-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-cute transition duration-150 transform hover:scale-[1.01]"
            >
                Sign In
            </button>
        </div>
    </form>

    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            New to ResumeSync? 
            <a href="register.html" class="font-medium text-accent-cute hover:text-accent-cute/80 transition duration-150">
                Create an account
            </a>
        </p>
    </div>
</div>

    <script src="./main.js"></script>
</body>
</html>
